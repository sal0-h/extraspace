name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep CI honest: a warning that would be a review comment should fail here.
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gtk4-rs, libadwaita-rs and gstreamer-rs all bind against system headers,
      # so these are build dependencies, not just runtime ones.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-pipewire \
            libpipewire-0.3-dev xvfb xauth

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Tests
        # GTK state tests use a virtual display; no tablet or compositor needed.
        run: GSETTINGS_BACKEND=memory xvfb-run -a cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the obsolete SDK package "tools".
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: extraspace-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  shell:
    name: Installer and packaging syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts
        run: |
          for script in scripts/*.sh packaging/mutter-patch/*.sh \
            packaging/mutter-patch/PKGBUILD \
            packaging/mutter-patch/extraspace-mutter-patch-check; do
            bash -n "$script"
          done
