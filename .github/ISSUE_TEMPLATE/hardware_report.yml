name: Hardware compatibility
description: Report compatibility with a tablet and GNOME setup
labels: [hardware-report]
title: "Hardware report: "
body:
  - type: markdown
    attributes:
      value: |
        Include your tablet model, Android version, GNOME version, and
        distribution. Reports where everything works help us track
        compatibility; partial results help us narrow down failures.

  - type: input
    id: tablet
    attributes:
      label: Tablet
      placeholder: e.g. Lenovo Tab P11, Android 13, 2000x1200
    validations:
      required: true

  - type: input
    id: desktop
    attributes:
      label: GNOME version and distribution
      placeholder: e.g. GNOME 48, Ubuntu 25.04
    validations:
      required: true

  - type: dropdown
    id: display
    attributes:
      label: Extra display
      options:
        - Works
        - Works with problems
        - Does not work
        - Did not try
    validations:
      required: true

  - type: dropdown
    id: touch
    attributes:
      label: Touch input
      options:
        - Works
        - Works with problems
        - Does not work
        - Did not try
    validations:
      required: true

  - type: dropdown
    id: camera
    attributes:
      label: Camera passthrough
      options:
        - Works
        - Works with problems
        - Does not work
        - Did not try
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Test details
      description: |
        Include USB or native Wi-Fi, encoder, scale, image quality, and any
        settings needed to make it work. Add measurements if available.
    validations:
      required: false
