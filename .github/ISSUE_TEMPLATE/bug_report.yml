name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Include your GNOME version, distribution, tablet model, and Android
        version. On Fedora, `./scripts/setup.sh --check` collects host setup
        information without installing anything.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: GNOME version, distribution, kernel, and encoder. On Fedora, paste `./scripts/setup.sh --check`.
      render: shell
      placeholder: |
        GNOME version:
        Distribution and kernel:
        Encoder:
    validations:
      required: true

  - type: input
    id: tablet
    attributes:
      label: Tablet
      description: Model and Android version
      placeholder: e.g. Samsung Galaxy Tab A8, Android 13
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: host-log
    attributes:
      label: Host log
      description: |
        Output of `RUST_LOG=debug ./target/release/extraspace`.
        The last 40 lines before the failure are usually enough.
      render: shell
    validations:
      required: false

  - type: textarea
    id: tablet-log
    attributes:
      label: Tablet log
      description: Output of `adb logcat -d -s extraspace:V`
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checked
    attributes:
      label: Before filing
      options:
        - label: "`adb devices` shows my tablet as `device`, not `unauthorized`"
        - label: I tried a different USB cable (a surprising number are charge-only)
