name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Include your desktop and tablet versions, connection type, and image
        quality setting. On Fedora, `./scripts/setup.sh --check` reports host
        dependencies without changing them.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: GNOME version, distribution, kernel, encoder, and display settings.
      render: shell
      placeholder: |
        GNOME version:
        Distribution and kernel:
        Encoder:
        Connection (USB or native Wi-Fi):
        Mode, scale, and image quality:
    validations:
      required: true

  - type: input
    id: tablet
    attributes:
      label: Tablet
      description: Model and Android version
      placeholder: e.g. Samsung Galaxy Tab A8, Android 13
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps to reproduce, expected behavior, and actual behavior.
    validations:
      required: true

  - type: textarea
    id: host-log
    attributes:
      label: Host log
      description: |
        Output of `RUST_LOG=debug ./target/release/extraspace`.
        The last 40 lines before the failure are usually enough.
      render: shell
    validations:
      required: false

  - type: textarea
    id: tablet-log
    attributes:
      label: Tablet log
      description: Output of `adb logcat -d -s extraspace:V`
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checked
    attributes:
      label: Before filing
      options:
        - label: "For USB: `adb devices` shows the tablet as `device`, and I tried a data cable."
        - label: "For Wi-Fi: both apps are open, and I checked pairing and network isolation."
